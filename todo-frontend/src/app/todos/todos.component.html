<!-- STATS ROW -->
<div nz-row [nzGutter]="16" style="margin-bottom: 20px">
  <div nz-col [nzSpan]="8">
    <nz-card>
      <nz-statistic nzTitle="Total Tasks" [nzValue]="totalCount"></nz-statistic>
    </nz-card>
  </div>
  <div nz-col [nzSpan]="8">
    <nz-card>
      <nz-statistic
        nzTitle="Pending"
        [nzValue]="pendingCount"
        [nzValueStyle]="{ color: '#faad14' }"
      ></nz-statistic>
    </nz-card>
  </div>
  <div nz-col [nzSpan]="8">
    <nz-card>
      <nz-statistic
        nzTitle="Completed"
        [nzValue]="completedCount"
        [nzValueStyle]="{ color: '#52c41a' }"
      ></nz-statistic>
    </nz-card>
  </div>
</div>

<!-- MAIN CARD -->
<nz-card>
  <div class="toolbar">
    <h2 nz-typography>My Tasks</h2>
    <button nz-button nzType="primary" (click)="openAddModal()">
      <span nz-icon nzType="plus"></span>
      Add Task
    </button>
  </div>

  <nz-divider></nz-divider>

  <nz-spin [nzSpinning]="loading">
    <nz-table #basicTable [nzData]="todos" [nzBordered]="true" [nzPageSize]="10">
      <thead>
        <tr>
          <th nzWidth="50px">Done</th>
          <th>Title</th>
          <th>Description</th>
          <th>Assigned To</th>
          <th>Due Date</th>
          <th>Status</th>
          <th nzWidth="160px">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let todo of basicTable.data" [class.row-done]="todo.isCompleted">
          <td>
            <label
              nz-checkbox
              [nzChecked]="todo.isCompleted"
              (nzCheckedChange)="toggleComplete(todo)"
            ></label>
          </td>
          <td>
            <span [class.text-done]="todo.isCompleted">{{ todo.title }}</span>
          </td>
          <td>
            <span class="text-muted">{{ todo.description || '—' }}</span>
          </td>
          <td>
            <nz-tag *ngIf="todo.user" nzColor="blue">{{ todo.user.name }}</nz-tag>
            <span *ngIf="!todo.user" class="text-muted">Unassigned</span>
          </td>
          <td>
            <span *ngIf="todo.dueDate">
              <nz-tag
                [nzColor]="todo.isCompleted ? 'default' : isOverdue(todo.dueDate) ? 'red' : 'blue'"
              >
                {{ todo.dueDate }}
              </nz-tag>
              <nz-tag *ngIf="!todo.isCompleted && isOverdue(todo.dueDate)" nzColor="red"
                >Overdue</nz-tag
              >
            </span>
            <span *ngIf="!todo.dueDate" class="text-muted">—</span>
          </td>
          <td>
            <nz-tag [nzColor]="todo.isCompleted ? 'success' : 'warning'">
              {{ todo.isCompleted ? 'Completed' : 'Pending' }}
            </nz-tag>
          </td>
          <td>
            <nz-space>
              <button
                *nzSpaceItem
                nz-button
                nzType="default"
                nzSize="small"
                (click)="openEditModal(todo)"
              >
                <span nz-icon nzType="edit"></span> Edit
              </button>
              <button
                *nzSpaceItem
                nz-button
                nzType="default"
                nzDanger
                nzSize="small"
                nz-popconfirm
                nzPopconfirmTitle="Are you sure you want to delete this task?"
                (nzOnConfirm)="deleteTodo(todo.id)"
              >
                <span nz-icon nzType="delete"></span> Delete
              </button>
            </nz-space>
          </td>
        </tr>
      </tbody>
    </nz-table>
  </nz-spin>
</nz-card>

<!-- ADD / EDIT MODAL -->
<nz-modal
  [(nzVisible)]="isModalVisible"
  [nzTitle]="isEditMode ? 'Edit Task' : 'Add New Task'"
  [nzOkText]="isEditMode ? 'Save Changes' : 'Add Task'"
  (nzOnOk)="handleSubmit()"
  (nzOnCancel)="handleCancel()"
>
  <ng-container *nzModalContent>
    <form nz-form [formGroup]="todoForm" nzLayout="vertical">
      <nz-form-item>
        <nz-form-label nzRequired>Title</nz-form-label>
        <nz-form-control nzErrorTip="Title is required and must be at least 3 characters.">
          <input nz-input formControlName="title" placeholder="Enter task title" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>Description</nz-form-label>
        <nz-form-control>
          <input
            nz-input
            formControlName="description"
            placeholder="Enter description (optional)"
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>Due Date</nz-form-label>
        <nz-form-control nzErrorTip="Due date is required.">
          <nz-date-picker
            formControlName="dueDate"
            [nzDisabledDate]="disablePastDates"
            nzPlaceHolder="Select due date"
            style="width: 100%"
          ></nz-date-picker>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>Assign To</nz-form-label>
        <nz-form-control>
          <nz-select
            formControlName="userId"
            nzPlaceHolder="Select a user (optional)"
            nzAllowClear
            style="width: 100%"
          >
            <nz-option
              *ngFor="let user of users"
              [nzValue]="user.id"
              [nzLabel]="user.name"
            ></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </form>
  </ng-container>
</nz-modal>
